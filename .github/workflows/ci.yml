name: ci
on:
  push:
  pull_request:
jobs:
  examples:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true
      - name: Syntax check every example
        run: |
          for f in lib/*.rb examples/*/*.rb; do bundle exec ruby -c "$f"; done
      - name: Load the SDK and the helper
        run: bundle exec ruby -Ilib -e 'require "loams_rest"; puts Loams::VERSION'
